apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: python-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/xraffay-dev/python-app
    targetRevision: HEAD
    path: charts/python-app
  destination:
    server: https://kubernetes.default.svc
    namespace: python-app
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
