redis-ha:
  enabled: false

controller:
  replicas: 1

repoServer:
  replicas: 1

applicationSet:
  replicas: 1

global:
  domain: argocd.test.com

configs:
  cm:
    # Allow Argo CD to observe Deployment/Pod status changes so application
    # health is recalculated after workloads become ready.
    resource.customizations.ignoreResourceUpdates.all: ""
  params:
    server.insecure: true

server:
  ingress:
    enabled: true
    ingressClassName: traefik
    tls: false
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web
