name: CD Deploy Pipeline

on:
  workflow_run:
    workflows: ["CI Build Pipeline"]
    types:
      - completed

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: ArgoCD Deploy
        shell: bash
        run: |
          argocd login argocd.test.com \
            --username ${{ vars.ARGOCD_USERNAME }} \
            --password ${{ secrets.ARGOCD_PASSWORD }} \
            --insecure \
            --grpc-web
          argocd app sync python-app