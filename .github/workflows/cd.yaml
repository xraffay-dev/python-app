name: CD Deploy Pipeline

on:
  workflow_run:
    workflows: ["CI Build Pipeline"]
    types:
      - completed

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: ArgoCD Deploy
        uses: clowdhaus/argo-cd-action/@main
        with:
          command: app sync python-app
          options: >-
            --username ${{ vars.ARGOCD_USERNAME }}
            --password ${{ secrets.ARGOCD_PASSWORD }}
            --server "argocd.test.com"
            # --insecure
            --grpc-web