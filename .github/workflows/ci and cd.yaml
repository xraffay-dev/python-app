name: CI & CD Pipeline

on:
  push:
    paths:
      - 'src/**'
    branches:
      - main

jobs:
  ci:
    name: CI Build Pipeline
    runs-on: ubuntu-latest

    steps:

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Shorten commit SHA
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: xraffay/python-app:${{ env.short_sha }}

  cd:
    needs: ci
    name: CD Deploy Pipeline
    runs-on: self-hosted

    steps:
      - name: Install Argo CD CLI
        shell: bash
        run: |
          curl -fksSL -o argocd-linux-amd64 https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          sudo install -m 555 argocd-linux-amd64 /usr/local/bin/argocd
          rm argocd-linux-amd64

      - name: ArgoCD Deploy
        shell: bash
        run: |
          argocd login argocd-server.argocd \
            --username "${{ vars.ARGOCD_USERNAME }}" \
            --password "${{ secrets.ARGOCD_PASSWORD }}" \
            --plaintext \
            --grpc-web


          argocd app sync python-app
          argocd app wait python-app --sync --health --timeout 300
